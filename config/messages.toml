# ATOM — client-facing messages
#
# The catalogue lives under its own top-level key so that it never collides
# with the section of the same name in `auth.toml`.
#
# Every string that reaches a client through the error envelope lives here.
# The stable machine-readable error `code` is **not** in this file: the code
# is part of the API contract and lives in `src/error.rs`.
#
# The messages for a database failure and for an unexpected failure are **not**
# here: they are part of the error type, because they must never be replaced
# by something that reveals an internal detail.
#
# `{}` is a placeholder. The values substituted into it are always numbers
# that the application controls, never user input, so there is no injection
# risk. A placeholder without a matching argument is left as `{}` rather than
# silently dropped, so a mistake is visible instead of invisible.
#
# See `config/README.md` for the precedence model.

[messages.general]
# 422, when a request fails a validation rule.
validation_failed = "The request failed validation."

# 413, when the request body is larger than the configured limit.
payload_too_large = "The request body is larger than the server accepts."

# 429, when the caller exceeded the rate limit.
rate_limited = "Too many requests. Try again later."

# 408, when the request exceeded the configured timeout.
timeout = "The request timed out."

# 400, when the request body is not valid JSON.
bad_request = "The request body is not valid JSON."

# 400, when a path or query parameter cannot be parsed.
malformed_parameter = "The request path or query string is malformed."

# 401, when a request needs a bearer token and does not carry a valid one.
unauthorized = "Authentication is required. Provide a Bearer access token."

# 404, when the route does not exist.
route_not_found = "The requested route does not exist."

[messages.auth]
# 401, for every failed login. The message never says which credential was
# wrong, so that it cannot be used to enumerate accounts.
invalid_credentials = "Invalid email or password."

# 401, when a bearer token is malformed, expired or signed with another key.
access_token_invalid = "The access token is invalid or expired."

# 401, when the presented refresh token is not known.
refresh_token_invalid = "The refresh token is invalid."

# 401, when a refresh token is presented a second time. Every session of the
# user is revoked at the same time.
refresh_token_reused = "The refresh token has already been used. All sessions have been revoked."

# 401, when the refresh token has passed its absolute lifetime.
refresh_token_expired = "The refresh token has expired."

# 403, when the account has been disabled.
account_disabled = "This account is disabled. Contact an administrator."

# 403, when a caller tries to revoke a session that belongs to somebody else.
not_own_session = "You may only revoke your own sessions."

# 409, when the email address is already registered.
email_already_registered = "An account with this email address already exists."

# 422, when the application and the database disagree about a rule. The
# database message is not returned, because it can contain the failing row.
database_constraint = "The request failed a database constraint."

[messages.validation]
# The address is not shaped like an address.
email_invalid = "must be a valid email address"

# The address is longer than the RFC 5321 path limit of 254 characters.
email_too_long = "must be at most {} characters long"

# The password is shorter than the configured minimum.
password_too_short = "must be at least {} characters long"

# The password is longer than the configured maximum.
password_too_long = "must be at most {} characters long"

# The password has no uppercase letter.
password_needs_uppercase = "must contain at least one uppercase letter"

# The password has no lowercase letter.
password_needs_lowercase = "must contain at least one lowercase letter"

# The password has no digit.
password_needs_digit = "must contain at least one digit"

# The display name is outside the accepted length range.
display_name_length = "must be between {} and {} characters long"

# The value is empty after trimming.
not_empty = "must not be empty"

# The value is longer than the accepted maximum.
#
# One template for every bounded field: the name of the field is carried by
# the violation itself, so the message does not have to repeat it.
too_long = "must be at most {} characters long"

# The currency code is not three letters.
#
# The value is trimmed and upper-cased before the check, so the message states
# the rule that remains: exactly three letters.
currency_invalid = "must be exactly three letters"

# A submission-date range runs backwards.
#
# The violation names `submitted_from`, because that is the field a client can
# correct.
date_range_order = "must not be later than submitted_to"

# The money value is not in the published four-decimal form.
#
# `NUMERIC(19,4)` rounds a value it is given instead of refusing it, so this
# check is the only thing that keeps `"12.5"` from silently becoming
# `"12.5000"` on the way back out (ADR-0007).
money_scale = "must be a decimal string with at most fifteen integer digits and exactly four decimal places"

# The item would push its claim's total past what the column can hold.
#
# A claim's total is `NUMERIC(19,4)` too, and each item may carry fifteen
# integer digits, so two items at their own maximum sum to more than the type
# can store. The refusal names `amount`, because that is the field a client can
# change; the bound is the same magnitude `money_scale` states.
claim_total_exceeds_maximum = "must keep the claim total at or below 999999999999999.9999"

# The category carries a character outside ASCII.
#
# The column re-checks its own `LOWER(BTRIM(...))`, and Unicode lower-casing in
# the service and `LOWER()` in the database do not agree for every code point,
# so only the ASCII range is normalised here and the rest is refused before the
# value can reach the database as a `23514`.
category_not_ascii = "must contain only ASCII characters"

# The receipt is a reference, not an upload, and the scheme is part of the
# contract: only `http` and `https` are accepted.
receipt_url_invalid = "must be an absolute http or https URL of at most 2048 characters"

# A company website is a client-supplied reference, never fetched. The column
# bounds it and requires the scheme; the service also requires an authority.
website_invalid = "must be an absolute http or https URL of at most 2048 characters"

# A job posting is stored as text and never fetched, for the same SSRF reason.
job_url_invalid = "must be an absolute http or https URL of at most 2048 characters"

# An application's applied-date range runs backwards.
#
# The violation names `applied_from`, because that is the field a client can
# correct.
applied_range_order = "must not be later than applied_to"

# A salary bound with no currency is a number whose meaning is unknown.
#
# The violation names `salary_currency`, because that is the field to add.
currency_required = "must be provided when salary_min or salary_max is given"

# A currency with no bound has nothing to denominate.
#
# The violation names `salary_currency`, because that is the field to remove.
currency_without_bound = "must be accompanied by salary_min or salary_max"

# A salary range whose minimum is above its maximum is refused rather than
# stored, so a report cannot silently average it into nonsense.
salary_range_order = "must not be greater than salary_max"

# The stage machine governs every change after creation, so a create that named
# a later stage would bypass it at birth.
stage_must_start_at_wishlist = "must be `wishlist` when an application is created"

# A claim can only be submitted with something to reimburse.
#
# The two violations name `items` and `total_amount` respectively, because the
# claim has no item to point at.
items_required = "must contain at least one item"
total_positive = "must be greater than zero"

[messages.resources]
# 404, when the user does not exist.
user_not_found = "The requested user does not exist."

# 404, when the note does not exist, or is not owned by the caller.
note_not_found = "The requested note does not exist."

# 404, when the project does not exist, or is not owned by the caller.
project_not_found = "The requested project does not exist."

# 404, when the task does not exist, or is not owned by the caller.
task_not_found = "The requested task does not exist."

# 404, when the expense claim does not exist, or is not owned by the caller.
claim_not_found = "The requested expense claim does not exist."

# 404, when the expense item does not exist, is not owned by the caller, or is
# addressed under a claim it does not belong to.
item_not_found = "The requested expense item does not exist."

# 404, when the company does not exist, or is not owned by the caller.
company_not_found = "The requested company does not exist."

# 404, when the job application does not exist, or is not owned by the caller.
application_not_found = "The requested job application does not exist."

# 404, when the event does not exist, is not owned by the caller, or is
# addressed under an application it does not belong to.
event_not_found = "The requested application event does not exist."

[messages.conflicts]
# 409, when an item is written on a claim that is no longer a draft.
#
# REIMB-R06 restricts every item write to `draft`; the message states the rule
# rather than the current status, so it stays true as the claim moves on.
claim_not_editable = "Items can only be added, changed or deleted while the claim is a draft."

# 409, when a lifecycle action is applied to a status the table does not allow.
#
# The message never names the current status or the refused action: the caller
# already knows both, and the text stays valid for every refused pair.
transition_not_allowed = "The claim's current status does not allow this action."

# 409, when a company name is already used by another company of the same owner,
# ignoring case.
#
# The comparison is folded by the database's functional unique index, so the
# message states the rule and not the comparison.
company_name_taken = "A company with this name already exists."

# 409, when a company still has applications.
#
# The applications are never deleted to make the delete succeed: they are
# records the client did not ask to delete.
company_has_applications = "The company still has job applications. Delete or move them first."

# 409, when a requested stage is not reachable from the application's current
# one.
#
# The message never names the current stage or the requested one, so it stays
# true for every refused pair of the stage machine.
stage_transition_not_allowed = "The application's current stage does not allow this change."
