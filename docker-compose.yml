# Local development services for ATOM.
#
# This file brings up PostgreSQL for local development and for the integration
# test suite. It does NOT build an application image: the API runs from the
# source tree with `cargo run`.
#
#   docker compose up -d postgres
#   docker compose ps
#   docker compose down            # stop, keep the data
#   docker compose down -v         # stop and delete the data
#
# The credentials here match `.env.example` and are for local development only.

name: atom

services:
  postgres:
    image: postgres:18-alpine
    container_name: atom-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: atom
      POSTGRES_PASSWORD: atom
      POSTGRES_DB: atom
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # PostgreSQL 18 keeps its data in a major-version directory
      # (`/var/lib/postgresql/18/docker`) and declares `/var/lib/postgresql` as
      # its volume. The image refuses to start when a volume is mounted at the
      # pre-18 `/var/lib/postgresql/data`, so the mount targets the directory
      # the image declares. That is also what makes the init script below run
      # exactly once, on a fresh volume.
      - atom-postgres-data:/var/lib/postgresql
      # The official image creates one database from `POSTGRES_DB`. The
      # integration suite needs a second, disposable one, and the harness
      # refuses to run unless its name contains "test"; the seeder refuses
      # `atom` and needs a development name. The script below creates
      # `atom_test` and `atom_dev` on first initialisation.
      - ./scripts/create-test-database.sh:/docker-entrypoint-initdb.d/10-create-test-database.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atom -d atom"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    command:
      - postgres
      - -c
      - max_connections=100

volumes:
  atom-postgres-data:
    name: atom-postgres-data
