[package]
name = "atom-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "ATOM — API-first personal workspace platform (Phase 1 backend)"
# The licence has not been chosen yet. `publish = false` keeps the crate
# from being published to a registry by accident. See CONTRIBUTING.md.
publish = false

[lib]
name = "atom_api"
path = "src/lib.rs"

[[bin]]
name = "atom-api"
path = "src/main.rs"

# Development tool: checks the documentation tree for consistency.
[[bin]]
name = "atom-docs"
path = "src/bin/atom-docs.rs"

# Development tool: seeds a disposable database with deterministic fixture
# data for the Phase 1 entities. Specification: docs/database/seeding.md.
[[bin]]
name = "atom-seed"
path = "src/bin/atom-seed.rs"

[features]
# The API explorer and the OpenAPI document served over HTTP.
#
# The Swagger UI bundle is 10.73 MiB of static assets, embedded in the binary
# by `rust-embed`, and a deployment that sets `api.docs_enabled = false` never
# serves a byte of it. Turning the dependency off removes the assets from the
# binary; a production build should therefore pass `--no-default-features`.
#
# The feature is on by default so that a plain `cargo build`, `cargo test` and
# `cargo run` keep the explorer.
default = ["docs"]
docs = ["dep:utoipa-swagger-ui"]

[dependencies]
# --- HTTP stack ---
axum = "0.8"
tower-http = { version = "0.6", features = [
    "trace",
    "cors",
    "request-id",
    "catch-panic",
] }
# --- Async runtime ---
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "signal",
    "time",
] }

# --- Persistence ---
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "macros",
    "migrate",
    "uuid",
    "chrono",
] }

# --- Serialization ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# --- Configuration files ---
# The configuration directory is TOML. `toml` provides the serde
# implementation, so the settings structures are ordinary `Deserialize` types.
toml = "1"

# --- Core primitives ---
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = [
    "clock",
    "std",
    "serde",
] }
rand = "0.9"
sha2 = "0.10"
base64 = "0.22"

# --- Authentication ---
argon2 = "0.5"
jsonwebtoken = "9"

# --- Errors and observability ---
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

# --- Configuration ---
dotenvy = "0.15"

# --- API documentation ---
utoipa = { version = "5", features = ["axum_extras", "chrono", "uuid"] }
# Optional: see the `docs` feature. `vendored` is required when the feature is
# on — without it the build script downloads the Swagger UI bundle from GitHub
# at compile time. It is embedded either way, so `vendored` costs nothing in
# binary size and makes the build reproducible and offline.
utoipa-swagger-ui = { version = "9", features = [
    "axum",
    "vendored",
], optional = true }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

# Line tables only: a backtrace still names the file and the line, but the
# debug information does not carry the type and variable layouts. The full
# debug profile produced 4.4 GB of build artifacts for this crate, which is
# enough to exhaust a small build machine and is larger than the crate itself.
[profile.dev]
debug = "line-tables-only"

