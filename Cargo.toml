[package]
name = "atom-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "ATOM — API-first personal workspace platform (Phase 1 backend)"
# The licence has not been chosen yet. `publish = false` keeps the crate
# from being published to a registry by accident. See CONTRIBUTING.md.
publish = false

[lib]
name = "atom_api"
path = "src/lib.rs"

[[bin]]
name = "atom-api"
path = "src/main.rs"

# Development tool: checks the documentation tree for consistency.
[[bin]]
name = "atom-docs"
path = "src/bin/atom-docs.rs"

[dependencies]
# --- HTTP stack ---
axum = { version = "0.8", features = ["macros"] }
tower-http = { version = "0.6", features = [
    "trace",
    "cors",
    "request-id",
    "catch-panic",
] }
# --- Async runtime ---
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "signal",
    "time",
    "sync",
] }

# --- Persistence ---
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "macros",
    "migrate",
    "uuid",
    "chrono",
    "json",
] }

# --- Serialization ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# --- Core primitives ---
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = [
    "clock",
    "std",
    "serde",
] }
rand = "0.9"
hex = "0.4"
sha2 = "0.10"
base64 = "0.22"

# --- Authentication ---
argon2 = "0.5"
jsonwebtoken = "9"

# --- Errors and observability ---
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

# --- Configuration ---
dotenvy = "0.15"

# --- API documentation ---
utoipa = { version = "5", features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "9", features = ["axum", "vendored"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

