[package]
name = "atom-api"
version = "0.1.0"
edition = "2024"
# The minimum is set by `burn` 0.22, which the default `ml` feature enables and
# which declares rustc 1.95. CI tracks `stable`, so this matches what it uses.
rust-version = "1.95"
description = "ATOM — API-first personal workspace platform (Phase 1 backend)"
# The licence has not been chosen yet. `publish = false` keeps the crate
# from being published to a registry by accident. See CONTRIBUTING.md.
publish = false

[lib]
name = "atom_api"
path = "src/lib.rs"

[[bin]]
name = "atom-api"
path = "src/main.rs"

# Development tool: checks the documentation tree for consistency.
[[bin]]
name = "atom-docs"
path = "src/bin/atom-docs.rs"

# Development tool: seeds a disposable database with deterministic fixture
# data for the Phase 1 entities. Specification: docs/database/seeding.md.
[[bin]]
name = "atom-seed"
path = "src/bin/atom-seed.rs"

# D4.M1 spike: measures a local Burn `flex` forward pass on this machine.
# A throwaway measurement tool, not a product binary. It requires the `ml`
# feature, so a build without it skips the binary entirely.
[[bin]]
name = "atom-ml-spike"
path = "src/bin/atom-ml-spike.rs"
required-features = ["ml"]

# The M3 re-measurement: the real six-layer encoder and the WordPiece tokenizer.
# Prints construction, first inference, steady state at 1/10/100 texts, peak RSS,
# the output norm, determinism, and a five-text/three-query retrieval check.
# A development tool, not a product binary; it reads a local model file and
# never downloads one.
[[bin]]
name = "atom-ml-bench"
path = "src/bin/atom-ml-bench.rs"
required-features = ["ml"]

[features]
# The API explorer and the OpenAPI document served over HTTP.
#
# The Swagger UI bundle is 10.73 MiB of static assets, embedded in the binary
# by `rust-embed`, and a deployment that sets `api.docs_enabled = false` never
# serves a byte of it. Turning the dependency off removes the assets from the
# binary; a production build should therefore pass `--no-default-features`.
#
# The feature is on by default so that a plain `cargo build`, `cargo test` and
# `cargo run` keep the explorer.
default = ["docs", "ml"]
docs = ["dep:utoipa-swagger-ui"]
# Local machine learning: Burn on the pure-Rust `flex` CPU backend.
# ADR-0008 §7.3 — on by default so a plain build has it, and switchable off so
# `cargo check --no-default-features` still builds the API without the model
# stack.
ml = ["dep:burn"]

[dependencies]
# --- HTTP stack ---
axum = "0.8"
tower-http = { version = "0.6", features = [
    "trace",
    "cors",
    "request-id",
    "catch-panic",
] }
# --- Async runtime ---
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "signal",
    "time",
] }

# --- Persistence ---
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "macros",
    "migrate",
    "uuid",
    "chrono",
] }

# --- Serialization ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# --- Configuration files ---
# The configuration directory is TOML. `toml` provides the serde
# implementation, so the settings structures are ordinary `Deserialize` types.
toml = "1"

# --- Core primitives ---
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = [
    "clock",
    "std",
    "serde",
] }
rand = "0.9"
sha2 = "0.10"
base64 = "0.22"

# --- Authentication ---
argon2 = "0.5"
jsonwebtoken = "9"

# --- Errors and observability ---
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

# --- Configuration ---
dotenvy = "0.15"

# --- API documentation ---
utoipa = { version = "5", features = ["axum_extras", "chrono", "uuid"] }
# Optional: see the `docs` feature. `vendored` is required when the feature is
# on — without it the build script downloads the Swagger UI bundle from GitHub
# at compile time. It is embedded either way, so `vendored` costs nothing in
# binary size and makes the build reproducible and offline.
utoipa-swagger-ui = { version = "9", features = [
    "axum",
    "vendored",
], optional = true }

# --- Local machine learning (feature `ml`) ---
# ADR-0008: Burn v0.22 on the `flex` CPU backend, pure Rust, no GPU and no
# second runtime. `std` and `flex` are the compute surface; `safetensors`
# enables burn-store's SafeTensors reader (and its `store` module), which is
# how the encoder's weights are loaded. It is the same crate graph `burn`
# already brings; default features would add `bm`/`fusion`/`train`, which no
# request uses.
# Optional: see the `ml` feature.
burn = { version = "0.22", default-features = false, features = [
    "std",
    "flex",
    "safetensors",
], optional = true }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

# Line tables only: a backtrace still names the file and the line, but the
# debug information does not carry the type and variable layouts. The full
# debug profile produced 4.4 GB of build artifacts for this crate, which is
# enough to exhaust a small build machine and is larger than the crate itself.
[profile.dev]
debug = "line-tables-only"

